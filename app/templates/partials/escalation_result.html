<div id="escalation-status">
  <div class="bg-purple-50 border border-purple-200 rounded-xl p-5 flex items-center gap-4">
    <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center flex-shrink-0">
      <svg class="w-5 h-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <div class="flex-1">
      <p class="text-sm font-semibold text-purple-900">Escalated to {{ reviewer.name }}</p>
      <p class="text-xs text-purple-600 mt-0.5">{{ reviewer.title }} · {{ reviewer.email }} · Notified now</p>
    </div>
    <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-purple-100 text-purple-800 ring-1 ring-purple-200">Escalated</span>
  </div>
</div>

<!-- Out-of-band: append new audit entry -->
<div hx-swap-oob="beforeend:#audit-trail">
  <div class="px-5 py-3 flex items-start gap-4 bg-purple-50/40">
    <div class="w-1.5 h-1.5 rounded-full bg-purple-400 mt-1.5 flex-shrink-0"></div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2">
        <span class="text-xs font-semibold text-gray-800">{{ audit_entry.action }}</span>
        <span class="text-xs text-gray-400">· {{ audit_entry.actor }}</span>
      </div>
      <p class="text-xs text-gray-500 mt-0.5">{{ audit_entry.detail }}</p>
    </div>
    <span class="text-xs text-gray-400 font-mono flex-shrink-0">
      {{ audit_entry.timestamp[:10] }} {{ audit_entry.timestamp[11:16] if audit_entry.timestamp | length > 10 else '' }}
    </span>
  </div>
</div>
